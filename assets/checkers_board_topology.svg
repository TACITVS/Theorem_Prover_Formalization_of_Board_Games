<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="boardEdge" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#2c1d11"/>
      <stop offset="100%" stop-color="#140c06"/>
    </radialGradient>
    <linearGradient id="darkSquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3728"/>
      <stop offset="100%" stop-color="#2d1f14"/>
    </linearGradient>
    <linearGradient id="lightSquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9c3a5"/>
      <stop offset="100%" stop-color="#bda07d"/>
    </linearGradient>
    <radialGradient id="whitePiece" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0dcd3"/>
      <stop offset="100%" stop-color="#9e988a"/>
    </radialGradient>
    <radialGradient id="blackPiece" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#555555"/>
      <stop offset="60%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-opacity="0.6"/>
    </filter>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e74c3c"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3498db"/>
    </marker>
  </defs>

  <!-- Outer Board Border -->
  <rect x="10" y="10" width="780" height="780" rx="16" fill="url(#boardEdge)" filter="url(#shadow)"/>
  <rect x="50" y="50" width="700" height="700" fill="#1f140c" stroke="#6b4c30" stroke-width="3"/>

  <!-- Coordinates Header / Numbers -->
  <g font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#caa57c" text-anchor="middle">
    <!-- Files (Columns 0 to 7) -->
    <text x="93.75" y="40">0</text><text x="181.25" y="40">1</text>
    <text x="268.75" y="40">2</text><text x="356.25" y="40">3</text>
    <text x="443.75" y="40">4</text><text x="531.25" y="40">5</text>
    <text x="618.75" y="40">6</text><text x="706.25" y="40">7</text>
    <!-- Ranks (Rows 0 to 7) -->
    <text x="35" y="98.75">0</text><text x="35" y="186.25">1</text>
    <text x="35" y="273.75">2</text><text x="35" y="361.25">3</text>
    <text x="35" y="448.75">4</text><text x="35" y="536.25">5</text>
    <text x="35" y="623.75">6</text><text x="35" y="711.25">7</text>
  </g>

  <!-- 64 Board Squares (8x8, each 87.5 x 87.5) -->
  <g id="squares">
    <!-- Row 0: Even rank -->
    <rect x="50" y="50" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="137.5" y="50" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="225" y="50" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="312.5" y="50" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="400" y="50" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="487.5" y="50" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="575" y="50" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="662.5" y="50" width="87.5" height="87.5" fill="url(#darkSquare)"/>

    <!-- Row 1: Odd rank -->
    <rect x="50" y="137.5" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="137.5" y="137.5" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="225" y="137.5" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="312.5" y="137.5" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="400" y="137.5" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="487.5" y="137.5" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="575" y="137.5" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="662.5" y="137.5" width="87.5" height="87.5" fill="url(#lightSquare)"/>

    <!-- Row 2: Even rank -->
    <rect x="50" y="225" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="137.5" y="225" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="225" y="225" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="312.5" y="225" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="400" y="225" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="487.5" y="225" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="575" y="225" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="662.5" y="225" width="87.5" height="87.5" fill="url(#darkSquare)"/>

    <!-- Row 3: Odd rank -->
    <rect x="50" y="312.5" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="137.5" y="312.5" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="225" y="312.5" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="312.5" y="312.5" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="400" y="312.5" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="487.5" y="312.5" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="575" y="312.5" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="662.5" y="312.5" width="87.5" height="87.5" fill="url(#lightSquare)"/>

    <!-- Row 4: Even rank -->
    <rect x="50" y="400" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="137.5" y="400" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="225" y="400" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="312.5" y="400" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="400" y="400" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="487.5" y="400" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="575" y="400" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="662.5" y="400" width="87.5" height="87.5" fill="url(#darkSquare)"/>

    <!-- Row 5: Odd rank -->
    <rect x="50" y="487.5" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="137.5" y="487.5" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="225" y="487.5" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="312.5" y="487.5" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="400" y="487.5" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="487.5" y="487.5" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="575" y="487.5" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="662.5" y="487.5" width="87.5" height="87.5" fill="url(#lightSquare)"/>

    <!-- Row 6: Even rank -->
    <rect x="50" y="575" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="137.5" y="575" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="225" y="575" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="312.5" y="575" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="400" y="575" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="487.5" y="575" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="575" y="575" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="662.5" y="575" width="87.5" height="87.5" fill="url(#darkSquare)"/>

    <!-- Row 7: Odd rank -->
    <rect x="50" y="662.5" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="137.5" y="662.5" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="225" y="662.5" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="312.5" y="662.5" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="400" y="662.5" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="487.5" y="662.5" width="87.5" height="87.5" fill="url(#lightSquare)"/>
    <rect x="575" y="662.5" width="87.5" height="87.5" fill="url(#darkSquare)"/>
    <rect x="662.5" y="662.5" width="87.5" height="87.5" fill="url(#lightSquare)"/>
  </g>

  <!-- 32 Square Labels {0..31} in gold text -->
  <g font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f1c40f" text-anchor="middle" dominant-baseline="central">
    <!-- Row 0 -->
    <text x="181.25" y="93.75">0</text><text x="356.25" y="93.75">1</text>
    <text x="531.25" y="93.75">2</text><text x="706.25" y="93.75">3</text>
    <!-- Row 1 -->
    <text x="93.75" y="181.25">4</text><text x="268.75" y="181.25">5</text>
    <text x="443.75" y="181.25">6</text><text x="618.75" y="181.25">7</text>
    <!-- Row 2 -->
    <text x="181.25" y="268.75">8</text><text x="356.25" y="268.75">9</text>
    <text x="531.25" y="268.75">10</text><text x="706.25" y="268.75">11</text>
    <!-- Row 3 -->
    <text x="93.75" y="356.25">12</text><text x="268.75" y="356.25">13</text>
    <text x="443.75" y="356.25">14</text><text x="618.75" y="356.25">15</text>
    <!-- Row 4 -->
    <text x="181.25" y="443.75">16</text><text x="356.25" y="443.75">17</text>
    <text x="531.25" y="443.75">18</text><text x="706.25" y="443.75">19</text>
    <!-- Row 5 -->
    <text x="93.75" y="531.25">20</text><text x="268.75" y="531.25">21</text>
    <text x="443.75" y="531.25">22</text><text x="618.75" y="531.25">23</text>
    <!-- Row 6 -->
    <text x="181.25" y="618.75">24</text><text x="356.25" y="618.75">25</text>
    <text x="531.25" y="618.75">26</text><text x="706.25" y="618.75">27</text>
    <!-- Row 7 -->
    <text x="93.75" y="706.25">28</text><text x="268.75" y="706.25">29</text>
    <text x="443.75" y="706.25">30</text><text x="618.75" y="706.25">31</text>
  </g>

  <!-- Diagonal Transition Vectors from Square 9 (Rank 2, Col 3) -->
  <!-- FL Step to Sq 13 (Rank 3, Col 2): dr=+1, dc=-1 -->
  <line x1="356.25" y1="268.75" x2="280" y2="345" stroke="#e74c3c" stroke-width="4" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <!-- FR Step to Sq 14 (Rank 3, Col 4): dr=+1, dc=+1 -->
  <line x1="356.25" y1="268.75" x2="430" y2="345" stroke="#e74c3c" stroke-width="4" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <!-- FL Jump from Sq 9 over Sq 13 to Sq 16 (+7 Jump) -->
  <line x1="356.25" y1="268.75" x2="195" y2="430" stroke="#3498db" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <!-- FR Jump from Sq 9 over Sq 14 to Sq 18 (+9 Jump) -->
  <line x1="356.25" y1="268.75" x2="515" y2="430" stroke="#3498db" stroke-width="5" marker-end="url(#arrowBlue)"/>

  <!-- Legend Overlay -->
  <rect x="520" y="680" width="220" height="60" rx="8" fill="#140c06" opacity="0.85" stroke="#caa57c" stroke-width="2"/>
  <text x="530" y="702" font-family="Arial" font-size="12" fill="#e74c3c">--- Diagonal Step (+4/+5/+3)</text>
  <text x="530" y="725" font-family="Arial" font-size="12" fill="#3498db">── Constant Jump (+7 / +9)</text>
</svg>
