<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style type="text/css">
      <![CDATA[
      /* Timeline: 16s infinite loop */
      /* 0s - 3s: Setup of 3-box chain (x=340, x=480, x=620 open) */
      /* 3s - 6s: Move 1 (P1 draws x=340, captures Box 1, earns bonus turn) */
      /* 6s - 10s: Move 2 (P1 SACRIFICE draws far outer edge x=620, leaving x=480 as a doubleton) */
      /* 10s - 16s: Move 3 (P2 ACCEPT draws dividing edge x=480, capturing Box 2 & Box 3, forced to open next chain) */

      .txt-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; fill: #f8fafc; }
      .txt-sub   { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 500; fill: #94a3b8; }
      .txt-mono  { font-family: 'Courier New', monospace; font-weight: 700; }

      /* Animation keyframes */
      @keyframes animEdgeB1 {
        0%, 20% { opacity: 0; stroke-dashoffset: 140; }
        26%, 100% { opacity: 1; stroke-dashoffset: 0; stroke: #38bdf8; }
      }
      @keyframes animFillB1 {
        0%, 24% { opacity: 0; transform: scale(0.8); }
        30%, 100% { opacity: 0.85; transform: scale(1); }
      }
      @keyframes animEdgeSacrifice {
        0%, 42% { opacity: 0; stroke-dashoffset: 140; }
        48%, 100% { opacity: 1; stroke-dashoffset: 0; stroke: #f59e0b; }
      }
      @keyframes animEdgeAccept {
        0%, 66% { opacity: 0; stroke-dashoffset: 140; }
        72%, 100% { opacity: 1; stroke-dashoffset: 0; stroke: #f43f5e; }
      }
      @keyframes animFillB2B3 {
        0%, 71% { opacity: 0; transform: scale(0.8); }
        77%, 100% { opacity: 0.85; transform: scale(1); }
      }
      @keyframes animGreedyAlert {
        0%, 3% { opacity: 0; transform: translateY(-10px); }
        8%, 22% { opacity: 1; transform: translateY(0); }
        26%, 100% { opacity: 0; transform: translateY(10px); }
      }
      @keyframes animBerlekampAlert {
        0%, 26% { opacity: 0; transform: translateY(-10px); }
        31%, 64% { opacity: 1; transform: translateY(0); }
        68%, 100% { opacity: 0; transform: translateY(10px); }
      }
      @keyframes animParityWinAlert {
        0%, 68% { opacity: 0; transform: translateY(-10px); }
        73%, 95% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(10px); }
      }

      .edge-b1 {
        stroke-dasharray: 140;
        animation: animEdgeB1 16s infinite ease-in-out;
      }
      .fill-b1 {
        transform-origin: 270px 300px;
        animation: animFillB1 16s infinite cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .edge-sacrifice {
        stroke-dasharray: 140;
        animation: animEdgeSacrifice 16s infinite ease-in-out;
      }
      .edge-accept {
        stroke-dasharray: 140;
        animation: animEdgeAccept 16s infinite ease-in-out;
      }
      .fill-b2b3 {
        transform-origin: 480px 300px;
        animation: animFillB2B3 16s infinite cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .alert-greedy {
        animation: animGreedyAlert 16s infinite ease-in-out;
      }
      .alert-berlekamp {
        animation: animBerlekampAlert 16s infinite ease-in-out;
      }
      .alert-parity {
        animation: animParityWinAlert 16s infinite ease-in-out;
      }
      ]]>
    </style>
  </defs>

  <!-- Deep Slate Background -->
  <rect width="960" height="620" fill="url(#bgGrad)" />

  <!-- Title & Subtitle -->
  <g transform="translate(480, 45)" text-anchor="middle">
    <text class="txt-title" font-size="24" letter-spacing="1.2">BERLEKAMP'S DOUBLE-DEALING SACRIFICE</text>
    <text y="26" class="txt-sub" font-size="13">
      The Hard-Hearted Handout: Sacrificing 2 Boxes in a 3-Box Chain to Retain Parity &amp; Long-Chain Control
    </text>
  </g>

  <!-- Animated Callout Badges -->
  <g transform="translate(480, 115)" text-anchor="middle">
    <!-- State 1: Greedy Trap Warning -->
    <g class="alert-greedy">
      <rect x="-320" y="-18" width="640" height="36" rx="18" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5" />
      <text y="5" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#fecaca">
        GREEDY TRAP: Taking all 3 boxes forces you to open the next chain, losing tempo!
      </text>
    </g>

    <!-- State 2: Berlekamp Move Announced -->
    <g class="alert-berlekamp">
      <rect x="-360" y="-18" width="720" height="36" rx="18" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <text y="5" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">
        BERLEKAMP DOUBLE-DEAL: P1 takes Box 1 (x=340), then plays far edge (x=620) leaving a doubleton!
      </text>
    </g>

    <!-- State 3: Parity Retained Victory -->
    <g class="alert-parity">
      <rect x="-360" y="-18" width="720" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <text y="5" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#e0e7ff">
        PARITY RETAINED: P2 draws dividing edge (x=480) for 2 boxes and MUST open the next chain!
      </text>
    </g>
  </g>

  <!-- 3-Box Chain Arena -->
  <!-- Box 1: (200, 230) to (340, 370) [w=140, h=140] -->
  <!-- Box 2: (340, 230) to (480, 370) [w=140, h=140] -->
  <!-- Box 3: (480, 230) to (620, 370) [w=140, h=140] -->
  <g transform="translate(80, 0)">
    <!-- Initially Open Vertical Edges (Dashed Guides at x=340, x=480, x=620) -->
    <line x1="340" y1="230" x2="340" y2="370" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" />
    <line x1="480" y1="230" x2="480" y2="370" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" />
    <line x1="620" y1="230" x2="620" y2="370" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" />

    <!-- Base Chain Existing Edges (Pre-played, Solid Gray #475569) -->
    <!-- Box 1 Existing Edges: Top, Bottom, Left (Right x=340 is open initially) -->
    <line x1="200" y1="230" x2="340" y2="230" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <line x1="200" y1="370" x2="340" y2="370" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <line x1="200" y1="230" x2="200" y2="370" stroke="#475569" stroke-width="4" stroke-linecap="round" />

    <!-- Box 2 Existing Edges: Top, Bottom (Left x=340 and Right x=480 are open initially) -->
    <line x1="340" y1="230" x2="480" y2="230" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <line x1="340" y1="370" x2="480" y2="370" stroke="#475569" stroke-width="4" stroke-linecap="round" />

    <!-- Box 3 Existing Edges: Top, Bottom (Left x=480 and Far Outer Right x=620 are open initially) -->
    <line x1="480" y1="230" x2="620" y2="230" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <line x1="480" y1="370" x2="620" y2="370" stroke="#475569" stroke-width="4" stroke-linecap="round" />

    <!-- Box 1 Captured Fill (P1 Cyan) -->
    <rect class="fill-b1" x="204" y="234" width="132" height="132" rx="8" fill="#0284c7" opacity="0" />
    <text class="fill-b1 txt-title" x="270" y="308" font-size="22" text-anchor="middle" fill="#f8fafc" opacity="0">
      P1 (+1)
    </text>

    <!-- Box 2 & Box 3 Sacrificed Doubleton Fill (P2 Rose) -->
    <g class="fill-b2b3" opacity="0">
      <rect x="344" y="234" width="132" height="132" rx="8" fill="#be123c" opacity="0.85" />
      <text class="txt-title" x="410" y="308" font-size="20" text-anchor="middle" fill="#f8fafc">
        P2 (+1)
      </text>

      <rect x="484" y="234" width="132" height="132" rx="8" fill="#be123c" opacity="0.85" />
      <text class="txt-title" x="550" y="308" font-size="20" text-anchor="middle" fill="#f8fafc">
        P2 (+1)
      </text>
    </g>

    <!-- Move 1 (P1 completes Box 1 at x=340, y=230..370, earning a bonus turn): Cyan glowing line -->
    <line class="edge-b1" x1="340" y1="230" x2="340" y2="370" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#glowCyan)" />

    <!-- Move 2 (P1 SACRIFICE draws far outer edge x=620, leaving dividing edge x=480 open as a doubleton): Amber glowing line -->
    <line class="edge-sacrifice" x1="620" y1="230" x2="620" y2="370" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" filter="url(#glowAmber)" />

    <!-- Move 3 (P2 ACCEPT draws dividing edge x=480, capturing both Box 2 and Box 3 simultaneously): Rose glowing line -->
    <line class="edge-accept" x1="480" y1="230" x2="480" y2="370" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" filter="url(#glowRose)" />

    <!-- Dot Lattice (4x2 = 8 dots) -->
    <g fill="#f8fafc">
      <circle cx="200" cy="230" r="7" /><circle cx="340" cy="230" r="7" /><circle cx="480" cy="230" r="7" /><circle cx="620" cy="230" r="7" />
      <circle cx="200" cy="370" r="7" /><circle cx="340" cy="370" r="7" /><circle cx="480" cy="370" r="7" /><circle cx="620" cy="370" r="7" />
    </g>

    <!-- Annotation Labels -->
    <text x="270" y="405" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">Box 1 (P1)</text>
    <text x="410" y="405" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#cbd5e1" text-anchor="middle">Box 2 (Doubleton)</text>
    <text x="550" y="405" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#cbd5e1" text-anchor="middle">Box 3 (Doubleton)</text>

    <!-- Move Indicator Labels -->
    <g transform="translate(340, 210)" text-anchor="middle">
      <text font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Move 1: P1 (+1)</text>
    </g>
    <g transform="translate(480, 210)" text-anchor="middle">
      <text font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f43f5e">Move 3: ACCEPT (P2 +2)</text>
    </g>
    <g transform="translate(620, 210)" text-anchor="middle">
      <text font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f59e0b">Move 2: SACRIFICE (P1)</text>
    </g>
  </g>

  <!-- Bottom Explanatory Card -->
  <g transform="translate(480, 520)" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">
    <rect x="-420" y="-45" width="840" height="90" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text y="-20" font-size="14" font-weight="700" fill="#f8fafc">
      Berlekamp's Parity Theorem: S = (2·C + 4·L) Total Sacrificed Boxes
    </text>
    <text y="5" font-size="12" fill="#94a3b8">
      In a 3-box chain, P1 takes Box 1 (x=340) and draws the far edge (x=620), leaving the shared divider (x=480) open.
    </text>
    <text y="28" font-size="12" font-weight="600" fill="#38bdf8">
      P2 captures the 2-box doubleton at x=480 (+2 points), but is compelled to open the next closed chain!
    </text>
  </g>
</svg>
