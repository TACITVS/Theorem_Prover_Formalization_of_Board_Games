<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 950" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="950" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern Background -->
  <g opacity="0.05" stroke="#38bdf8" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="950"/>
    <line x1="300" y1="0" x2="300" y2="950"/>
    <line x1="450" y1="0" x2="450" y2="950"/>
    <line x1="600" y1="0" x2="600" y2="950"/>
    <line x1="750" y1="0" x2="750" y2="950"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="450" x2="900" y2="450"/>
    <line x1="0" y1="600" x2="900" y2="600"/>
    <line x1="0" y1="750" x2="900" y2="750"/>
  </g>

  <!-- Title Header -->
  <g id="header">
    <text x="450" y="55" fill="#f8fafc" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="1">NINE MEN'S MORRIS (MILL)</text>
    <text x="450" y="85" fill="#94a3b8" font-size="15" font-weight="500" text-anchor="middle">24 Vertices • 32 Edges • 16 Mills • Exact Draw (Ralph Gasser 1993)</text>
    <rect x="250" y="100" width="400" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="450" y="119" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle">Uniform Mill Regularity: deg(v) = 2 for all 24 vertices</text>
  </g>

  <!-- Board Edges Group -->
  <g id="board-edges" stroke="#475569" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ring 0: Outer Square (x: 150 to 750, y: 180 to 780) -->
    <rect x="150" y="180" width="600" height="600" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.8"/>
    
    <!-- Ring 1: Middle Square (x: 250 to 650, y: 280 to 680) -->
    <rect x="250" y="280" width="400" height="400" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.8"/>
    
    <!-- Ring 2: Inner Square (x: 350 to 550, y: 380 to 580) -->
    <rect x="350" y="380" width="200" height="200" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.8"/>

    <!-- Radial Midpoint Connectors (4 cross arms) -->
    <line x1="450" y1="180" x2="450" y2="380" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.8"/>
    <line x1="550" y1="480" x2="750" y2="480" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.8"/>
    <line x1="450" y1="580" x2="450" y2="780" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.8"/>
    <line x1="150" y1="480" x2="350" y2="480" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.8"/>
  </g>

  <!-- Canonical 8-Stone Transversal Barrier Overlay (Golden Shield) -->
  <g id="transversal-connections" opacity="0.3" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4">
    <polygon points="450,180 750,480 450,780 150,480" fill="none"/>
    <polygon points="250,280 650,680 350,380 550,580" fill="none"/>
  </g>

  <!-- Vertices Group (Coordinates: Ring 0, Ring 1, Ring 2) -->
  <!-- Regular Nodes: Cyan/Slate | Transversal Nodes: Glowing Gold -->
  <g id="vertices">
    <!-- Ring 0: Outer (0..7) -->
    <!-- 0: Outer NW (150, 180) -->
    <circle cx="150" cy="180" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="150" y="185" fill="#f1f5f9" font-size="12" font-weight="700" text-anchor="middle">0</text>
    <text x="115" y="165" fill="#94a3b8" font-size="11">NW(0)</text>

    <!-- 1: Outer N (450, 180) - TRANSVERSAL -->
    <circle cx="450" cy="180" r="16" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="3" filter="url(#glowGold)"/>
    <text x="450" y="185" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">1</text>
    <text x="450" y="155" fill="#facc15" font-size="12" font-weight="700" text-anchor="middle">T₁: N(1)</text>

    <!-- 2: Outer NE (750, 180) -->
    <circle cx="750" cy="180" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="750" y="185" fill="#f1f5f9" font-size="12" font-weight="700" text-anchor="middle">2</text>
    <text x="785" y="165" fill="#94a3b8" font-size="11">NE(2)</text>

    <!-- 3: Outer E (750, 480) - TRANSVERSAL -->
    <circle cx="750" cy="480" r="16" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="3" filter="url(#glowGold)"/>
    <text x="750" y="485" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">3</text>
    <text x="795" y="485" fill="#facc15" font-size="12" font-weight="700">T₂: E(3)</text>

    <!-- 4: Outer SE (750, 780) -->
    <circle cx="750" cy="780" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="750" y="785" fill="#f1f5f9" font-size="12" font-weight="700" text-anchor="middle">4</text>
    <text x="785" y="805" fill="#94a3b8" font-size="11">SE(4)</text>

    <!-- 5: Outer S (450, 780) - TRANSVERSAL -->
    <circle cx="450" cy="780" r="16" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="3" filter="url(#glowGold)"/>
    <text x="450" y="785" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">5</text>
    <text x="450" y="815" fill="#facc15" font-size="12" font-weight="700" text-anchor="middle">T₃: S(5)</text>

    <!-- 6: Outer SW (150, 780) -->
    <circle cx="150" cy="780" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="150" y="785" fill="#f1f5f9" font-size="12" font-weight="700" text-anchor="middle">6</text>
    <text x="115" y="805" fill="#94a3b8" font-size="11">SW(6)</text>

    <!-- 7: Outer W (150, 480) - TRANSVERSAL -->
    <circle cx="150" cy="480" r="16" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="3" filter="url(#glowGold)"/>
    <text x="150" y="485" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">7</text>
    <text x="85" y="485" fill="#facc15" font-size="12" font-weight="700">T₄: W(7)</text>

    <!-- Ring 1: Middle (8..15) -->
    <!-- 8: Mid NW (250, 280) - TRANSVERSAL -->
    <circle cx="250" cy="280" r="16" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="3" filter="url(#glowGold)"/>
    <text x="250" y="285" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">8</text>
    <text x="220" y="265" fill="#facc15" font-size="12" font-weight="700">T₅: 8</text>

    <!-- 9: Mid N (450, 280) -->
    <circle cx="450" cy="280" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="450" y="285" fill="#f1f5f9" font-size="12" font-weight="700" text-anchor="middle">9</text>

    <!-- 10: Mid NE (650, 280) -->
    <circle cx="650" cy="280" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="650" y="285" fill="#f1f5f9" font-size="12" font-weight="700" text-anchor="middle">10</text>

    <!-- 11: Mid E (650, 480) -->
    <circle cx="650" cy="480" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="650" y="485" fill="#f1f5f9" font-size="12" font-weight="700" text-anchor="middle">11</text>

    <!-- 12: Mid SE (650, 680) - TRANSVERSAL -->
    <circle cx="650" cy="680" r="16" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="3" filter="url(#glowGold)"/>
    <text x="650" y="685" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">12</text>
    <text x="670" y="705" fill="#facc15" font-size="12" font-weight="700">T₆: 12</text>

    <!-- 13: Mid S (450, 680) -->
    <circle cx="450" cy="680" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="450" y="685" fill="#f1f5f9" font-size="12" font-weight="700" text-anchor="middle">13</text>

    <!-- 14: Mid SW (250, 680) -->
    <circle cx="250" cy="680" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="250" y="685" fill="#f1f5f9" font-size="12" font-weight="700" text-anchor="middle">14</text>

    <!-- 15: Mid W (250, 480) -->
    <circle cx="250" cy="480" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="250" y="485" fill="#f1f5f9" font-size="12" font-weight="700" text-anchor="middle">15</text>

    <!-- Ring 2: Inner (16..23) -->
    <!-- 16: In NW (350, 380) - TRANSVERSAL -->
    <circle cx="350" cy="380" r="16" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="3" filter="url(#glowGold)"/>
    <text x="350" y="385" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">16</text>
    <text x="320" y="375" fill="#facc15" font-size="12" font-weight="700">T₇: 16</text>

    <!-- 17: In N (450, 380) -->
    <circle cx="450" cy="380" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="450" y="385" fill="#f1f5f9" font-size="12" font-weight="700" text-anchor="middle">17</text>

    <!-- 18: In NE (550, 380) -->
    <circle cx="550" cy="380" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="550" y="385" fill="#f1f5f9" font-size="12" font-weight="700" text-anchor="middle">18</text>

    <!-- 19: In E (550, 480) -->
    <circle cx="550" cy="480" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="550" y="485" fill="#f1f5f9" font-size="12" font-weight="700" text-anchor="middle">19</text>

    <!-- 20: In SE (550, 580) - TRANSVERSAL -->
    <circle cx="550" cy="580" r="16" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="3" filter="url(#glowGold)"/>
    <text x="550" y="585" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">20</text>
    <text x="575" y="605" fill="#facc15" font-size="12" font-weight="700">T₈: 20</text>

    <!-- 21: In S (450, 580) -->
    <circle cx="450" cy="580" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="450" y="585" fill="#f1f5f9" font-size="12" font-weight="700" text-anchor="middle">21</text>

    <!-- 22: In SW (350, 580) -->
    <circle cx="350" cy="580" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="350" y="585" fill="#f1f5f9" font-size="12" font-weight="700" text-anchor="middle">22</text>

    <!-- 23: In W (350, 480) -->
    <circle cx="350" cy="480" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="350" y="485" fill="#f1f5f9" font-size="12" font-weight="700" text-anchor="middle">23</text>
  </g>

  <!-- Legend & Bottom Info Card -->
  <g id="footer-card" transform="translate(70, 840)">
    <rect width="760" height="90" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Legend Item 1: Regular Points -->
    <circle cx="30" cy="30" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="50" y="35" fill="#cbd5e1" font-size="13" font-weight="600">Standard Board Vertex (Degree 2 in Mill Hypergraph)</text>

    <!-- Legend Item 2: Canonical Transversal Barrier -->
    <circle cx="30" cy="62" r="10" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="2.5"/>
    <text x="50" y="67" fill="#facc15" font-size="13" font-weight="700">Canonical 8-Stone Transversal Barrier T₈ = {1, 3, 5, 7, 8, 12, 16, 20}</text>
    
    <!-- Mathematical Stats -->
    <text x="480" y="35" fill="#94a3b8" font-size="13">Cubic Dual Graph: <tspan fill="#38bdf8" font-weight="700">16 Vertices, 3-Regular</tspan></text>
    <text x="480" y="67" fill="#94a3b8" font-size="13">Defensive Surplus: <tspan fill="#4ade80" font-weight="700">9 stones - 8 required = +1</tspan></text>
  </g>
</svg>
