<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 780" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="whiteDisc" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <radialGradient id="blackDisc" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <radialGradient id="centerOpening" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title & Headers -->
  <text x="475" y="42" text-anchor="middle" font-size="26" font-weight="800" fill="url(#headerGrad)" letter-spacing="1">
    CLASSIC 7 × 6 CONNECT-FOUR (k = 4): VALUE = WIN WHITE
  </text>
  <text x="475" y="70" text-anchor="middle" font-size="14" font-weight="500" fill="#94a3b8">
    Victor Allis Claimeven Pairing (57 / 69 Lines) &amp; Center Column 3 Odd-Threat Zugzwang
  </text>

  <!-- Main Board Casing -->
  <rect x="70" y="95" width="810" height="520" rx="24" fill="url(#boardGrad)" stroke="#3b82f6" stroke-width="3" filter="url(#shadow)"/>

  <!-- Center Column 3 Highlight Spine -->
  <rect x="420" y="105" width="110" height="500" rx="16" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="475" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">
    CENTER SPINE (COL 3)
  </text>

  <!-- Grid Rows & Columns -->
  <!-- Col coordinates: 0:130, 1:245, 2:360, 3:475, 4:590, 5:705, 6:820 -->
  <!-- Row coordinates (bottom to top):
       Row 0: 560
       Row 1: 480
       Row 2: 400
       Row 3: 320
       Row 4: 240
       Row 5: 160
  -->

  <!-- Draw Vertical Domino Groupings -->
  <!-- Col 0..6 Vertical Domino Brackets -->
  <g stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" fill="none">
    <!-- Domino Pairings (r0,r1), (r2,r3), (r4,r5) -->
    <rect x="90" y="445" width="80" height="145" rx="40" stroke="#38bdf8" stroke-opacity="0.4"/>
    <rect x="90" y="285" width="80" height="145" rx="40" stroke="#38bdf8" stroke-opacity="0.4"/>
    <rect x="90" y="125" width="80" height="145" rx="40" stroke="#38bdf8" stroke-opacity="0.4"/>

    <rect x="205" y="445" width="80" height="145" rx="40" stroke="#38bdf8" stroke-opacity="0.4"/>
    <rect x="205" y="285" width="80" height="145" rx="40" stroke="#38bdf8" stroke-opacity="0.4"/>
    <rect x="205" y="125" width="80" height="145" rx="40" stroke="#38bdf8" stroke-opacity="0.4"/>

    <rect x="320" y="445" width="80" height="145" rx="40" stroke="#38bdf8" stroke-opacity="0.4"/>
    <rect x="320" y="285" width="80" height="145" rx="40" stroke="#38bdf8" stroke-opacity="0.4"/>
    <rect x="320" y="125" width="80" height="145" rx="40" stroke="#38bdf8" stroke-opacity="0.4"/>

    <rect x="435" y="445" width="80" height="145" rx="40" stroke="#f59e0b" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="435" y="285" width="80" height="145" rx="40" stroke="#f59e0b" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="435" y="125" width="80" height="145" rx="40" stroke="#f59e0b" stroke-opacity="0.7" stroke-width="2"/>

    <rect x="550" y="445" width="80" height="145" rx="40" stroke="#38bdf8" stroke-opacity="0.4"/>
    <rect x="550" y="285" width="80" height="145" rx="40" stroke="#38bdf8" stroke-opacity="0.4"/>
    <rect x="550" y="125" width="80" height="145" rx="40" stroke="#38bdf8" stroke-opacity="0.4"/>

    <rect x="665" y="445" width="80" height="145" rx="40" stroke="#38bdf8" stroke-opacity="0.4"/>
    <rect x="665" y="285" width="80" height="145" rx="40" stroke="#38bdf8" stroke-opacity="0.4"/>
    <rect x="665" y="125" width="80" height="145" rx="40" stroke="#38bdf8" stroke-opacity="0.4"/>

    <rect x="780" y="445" width="80" height="145" rx="40" stroke="#38bdf8" stroke-opacity="0.4"/>
    <rect x="780" y="285" width="80" height="145" rx="40" stroke="#38bdf8" stroke-opacity="0.4"/>
    <rect x="780" y="125" width="80" height="145" rx="40" stroke="#38bdf8" stroke-opacity="0.4"/>
  </g>

  <!-- Board Holes & Discs -->
  <!-- Col 0 -->
  <circle cx="130" cy="560" r="32" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <circle cx="130" cy="480" r="32" fill="url(#blackDisc)"/>
  <circle cx="130" cy="400" r="32" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <circle cx="130" cy="320" r="32" fill="url(#blackDisc)"/>
  <circle cx="130" cy="240" r="32" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <circle cx="130" cy="160" r="32" fill="url(#blackDisc)"/>

  <!-- Col 1 -->
  <circle cx="245" cy="560" r="32" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <circle cx="245" cy="480" r="32" fill="url(#blackDisc)"/>
  <circle cx="245" cy="400" r="32" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <circle cx="245" cy="320" r="32" fill="url(#blackDisc)"/>
  <circle cx="245" cy="240" r="32" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <circle cx="245" cy="160" r="32" fill="url(#blackDisc)"/>

  <!-- Col 2 -->
  <circle cx="360" cy="560" r="32" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <circle cx="360" cy="480" r="32" fill="url(#blackDisc)"/>
  <circle cx="360" cy="400" r="32" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <circle cx="360" cy="320" r="32" fill="url(#blackDisc)"/>
  <circle cx="360" cy="240" r="32" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <circle cx="360" cy="160" r="32" fill="url(#blackDisc)"/>

  <!-- Col 3: Center Column -->
  <!-- Opening Move: (3, 0) at cy=560 -->
  <circle cx="475" cy="560" r="32" fill="url(#centerOpening)" stroke="#fef08a" stroke-width="3" filter="url(#shadow)"/>
  <text x="475" y="565" text-anchor="middle" font-size="14" font-weight="800" fill="#78350f">P1 ★</text>

  <!-- (3, 1) Black Claimeven Reply -->
  <circle cx="475" cy="480" r="32" fill="url(#blackDisc)"/>

  <!-- (3, 2) White Center Threat Spine -->
  <circle cx="475" cy="400" r="32" fill="url(#whiteDisc)" stroke="#38bdf8" stroke-width="2"/>
  <text x="475" y="405" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">(3,2)</text>

  <!-- (3, 3) Black Reply -->
  <circle cx="475" cy="320" r="32" fill="url(#blackDisc)"/>

  <!-- (3, 4) White Center Threat Spine -->
  <circle cx="475" cy="240" r="32" fill="url(#whiteDisc)" stroke="#38bdf8" stroke-width="2"/>
  <text x="475" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">(3,4)</text>

  <!-- (3, 5) Black Reply -->
  <circle cx="475" cy="160" r="32" fill="url(#blackDisc)"/>

  <!-- Col 4 -->
  <circle cx="590" cy="560" r="32" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <circle cx="590" cy="480" r="32" fill="url(#blackDisc)"/>
  <circle cx="590" cy="400" r="32" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <circle cx="590" cy="320" r="32" fill="url(#blackDisc)"/>
  <circle cx="590" cy="240" r="32" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <circle cx="590" cy="160" r="32" fill="url(#blackDisc)"/>

  <!-- Col 5 -->
  <circle cx="705" cy="560" r="32" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <circle cx="705" cy="480" r="32" fill="url(#blackDisc)"/>
  <circle cx="705" cy="400" r="32" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <circle cx="705" cy="320" r="32" fill="url(#blackDisc)"/>
  <circle cx="705" cy="240" r="32" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <circle cx="705" cy="160" r="32" fill="url(#blackDisc)"/>

  <!-- Col 6 -->
  <circle cx="820" cy="560" r="32" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <circle cx="820" cy="480" r="32" fill="url(#blackDisc)"/>
  <circle cx="820" cy="400" r="32" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <circle cx="820" cy="320" r="32" fill="url(#blackDisc)"/>
  <circle cx="820" cy="240" r="32" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <circle cx="820" cy="160" r="32" fill="url(#blackDisc)"/>

  <!-- Column & Row Labels -->
  <g font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">
    <text x="130" y="605">Col 0</text>
    <text x="245" y="605">Col 1</text>
    <text x="360" y="605">Col 2</text>
    <text x="475" y="605" fill="#f59e0b">Col 3 (Center)</text>
    <text x="590" y="605">Col 4</text>
    <text x="705" y="605">Col 5</text>
    <text x="820" y="605">Col 6</text>

    <text x="45" y="565">Row 0</text>
    <text x="45" y="485" fill="#38bdf8">Row 1</text>
    <text x="45" y="405">Row 2</text>
    <text x="45" y="325" fill="#38bdf8">Row 3</text>
    <text x="45" y="245">Row 4</text>
    <text x="45" y="165" fill="#38bdf8">Row 5</text>
  </g>

  <!-- Bottom Theoretical Architecture Summary Card -->
  <rect x="70" y="630" width="810" height="130" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- Column 1 of Card: Theorems -->
  <g font-size="13" fill="#cbd5e1">
    <text x="95" y="660" font-weight="700" fill="#38bdf8">📐 BOOK THEOREM I: CLAIMEVEN COLLAPSE</text>
    <text x="95" y="682">21 Odd-Row Cells O_21 double-block all 21 Verticals</text>
    <text x="95" y="700">and all 24 Diagonals, plus 12 Odd Horizontals.</text>
    <text x="95" y="722" font-weight="700" fill="#4ade80">Kills 57 of 69 Lines (82.6%) at Move 0!</text>
  </g>

  <!-- Column 2 of Card: Center Spine -->
  <g font-size="13" fill="#cbd5e1">
    <text x="390" y="660" font-weight="700" fill="#f59e0b">⚖️ BOOK THEOREM II: CENTER PIGEONHOLE</text>
    <text x="390" y="682">Every 4-window on 7 columns contains Col 3.</text>
    <text x="390" y="700">All 12 surviving Even Horizontals cross Col 3.</text>
    <text x="390" y="722" font-weight="700" fill="#4ade80">White opens (3, 0) to control center spine!</text>
  </g>

  <!-- Column 3 of Card: Verification -->
  <g font-size="13" fill="#cbd5e1">
    <text x="685" y="660" font-weight="700" fill="#ec4899">🛡️ DUAL PROVER VERIFICATION</text>
    <text x="685" y="682">Rocq 9.1: 41 Theorems Closed (0 Axioms)</text>
    <text x="685" y="700">Lean 4.35: 22 Theorems (0 Sorry)</text>
    <text x="685" y="722" font-weight="700" fill="#4ade80">C11 SWAR: 5.2M nodes in 49.15 ms!</text>
  </g>
</svg>
