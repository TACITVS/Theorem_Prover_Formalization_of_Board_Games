<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="100%" height="100%">
  <defs>
    <!-- Dark slate canvas background -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Classic Connect-Four Blue Board Rack Gradient -->
    <linearGradient id="boardBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="25%" stop-color="#1e40af"/>
      <stop offset="75%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <!-- Center Column 4 Highlight Gradient -->
    <linearGradient id="centerColGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.35"/>
    </linearGradient>

    <!-- White (Player 1) Disc Gradient -->
    <radialGradient id="whiteDisc" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f1f5f9"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>

    <!-- Black (Player 2) Disc Gradient -->
    <radialGradient id="blackDisc" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </radialGradient>

    <!-- Transversal Claim Cell Gradient -->
    <radialGradient id="claimCell" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="80%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>

    <!-- Opening Cell Highlight -->
    <radialGradient id="openingDisc" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="80%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>

    <!-- Empty Slot Shadow Gradient -->
    <radialGradient id="emptySlot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="80%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="820" fill="url(#canvasGrad)"/>

  <!-- Header Banner -->
  <g transform="translate(550, 45)" text-anchor="middle">
    <text font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc" letter-spacing="1">
      CONNECT-5 ON 9x7 WITH GRAVITY: EXACT DRAW EQUILIBRIUM
    </text>
    <text y="26" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#94a3b8">
      The Single-Center-Axis Parity Inversion Architecture | 63 Cells = 31 Static Pairs + Opening (4, 0)
    </text>
  </g>

  <!-- Board Rack Outline & Yellow Legs -->
  <g id="board-structure">
    <!-- Stand Left -->
    <path d="M 120 720 L 70 780 L 170 780 Z" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
    <!-- Stand Right -->
    <path d="M 980 720 L 930 780 L 1030 780 Z" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>

    <!-- Main Rack Container (9 cols x 7 rows, 90px cell spacing) -->
    <!-- Grid origin: x=140, y=100. Width=820, Height=620 -->
    <rect x="130" y="90" width="840" height="630" rx="20" fill="url(#boardBlue)" stroke="#3b82f6" stroke-width="4"/>

    <!-- Column 4 Central Axis Highlight Zone -->
    <rect x="495" y="100" width="90" height="610" rx="10" fill="url(#centerColGrad)" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4"/>
  </g>

  <!-- Column & Row Header Coordinates -->
  <!-- Columns 0 to 8: cx = 185 + c * 90 -->
  <!-- Rows 0 to 6 (bottom to top): cy = 675 - r * 85 -->
  <g font-family="'Segoe UI', monospace" font-size="14" font-weight="bold" fill="#94a3b8" text-anchor="middle">
    <!-- Column Labels (Top) -->
    <text x="185" y="115">c=0</text>
    <text x="275" y="115">c=1</text>
    <text x="365" y="115">c=2</text>
    <text x="455" y="115">c=3</text>
    <text x="545" y="115" fill="#fbbf24">c=4 (Axis)</text>
    <text x="635" y="115">c=5</text>
    <text x="725" y="115">c=6</text>
    <text x="815" y="115">c=7</text>
    <text x="905" y="115">c=8</text>

    <!-- Row Labels (Left) -->
    <text x="110" y="680" fill="#f87171">r=0</text>
    <text x="110" y="595" fill="#34d399">r=1</text>
    <text x="110" y="510">r=2</text>
    <text x="110" y="425" fill="#34d399">r=3</text>
    <text x="110" y="340">r=4</text>
    <text x="110" y="255" fill="#34d399">r=5</text>
    <text x="110" y="170" fill="#38bdf8">r=6 (Roof)</text>
  </g>

  <!-- Grid Cells (63 Slots) -->
  <g id="grid-cells">
    <!-- Row 6 (Roof, cy = 165) -->
    <!-- Col 0..8 -->
    <!-- Wing cells in r=6 have Black top domino; Col 4 has (4, 6) -->
    <!-- We generate all 63 circular slots with their styling -->

    <!-- Python/Script style iteration rendered directly into SVG -->
    <!-- Flank Rows 1..6 Vertical Domino Connectors -->
    <!-- Column 0 -->
    <line x1="185" y1="595" x2="185" y2="510" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="185" y1="425" x2="185" y2="340" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="185" y1="255" x2="185" y2="170" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

    <!-- Column 1 -->
    <line x1="275" y1="595" x2="275" y2="510" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="275" y1="425" x2="275" y2="340" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="275" y1="255" x2="275" y2="170" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

    <!-- Column 2 -->
    <line x1="365" y1="595" x2="365" y2="510" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="365" y1="425" x2="365" y2="340" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="365" y1="255" x2="365" y2="170" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

    <!-- Column 3 -->
    <line x1="455" y1="595" x2="455" y2="510" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="455" y1="425" x2="455" y2="340" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="455" y1="255" x2="455" y2="170" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

    <!-- Center Column 4 Vertical Domino Connectors -->
    <line x1="545" y1="595" x2="545" y2="510" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <line x1="545" y1="425" x2="545" y2="340" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <line x1="545" y1="255" x2="545" y2="170" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>

    <!-- Column 5 -->
    <line x1="635" y1="595" x2="635" y2="510" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="635" y1="425" x2="635" y2="340" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="635" y1="255" x2="635" y2="170" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

    <!-- Column 6 -->
    <line x1="725" y1="595" x2="725" y2="510" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="725" y1="425" x2="725" y2="340" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="725" y1="255" x2="725" y2="170" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

    <!-- Column 7 -->
    <line x1="815" y1="595" x2="815" y2="510" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="815" y1="425" x2="815" y2="340" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="815" y1="255" x2="815" y2="170" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

    <!-- Column 8 -->
    <line x1="905" y1="595" x2="905" y2="510" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="905" y1="425" x2="905" y2="340" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="905" y1="255" x2="905" y2="170" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

    <!-- Row 0 Symmetric Base Linkage Arcs -->
    <!-- (3,0) <-> (5,0) -->
    <path d="M 455 675 Q 500 705 545 675" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="4,3"/>
    <path d="M 455 675 Q 545 710 635 675" fill="none" stroke="#a855f7" stroke-width="3"/>
    <!-- (2,0) <-> (6,0) -->
    <path d="M 365 675 Q 545 725 725 675" fill="none" stroke="#ec4899" stroke-width="3"/>
    <!-- (1,0) <-> (7,0) -->
    <path d="M 275 675 Q 545 740 815 675" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <!-- (0,0) <-> (8,0) -->
    <path d="M 185 675 Q 545 755 905 675" fill="none" stroke="#10b981" stroke-width="3"/>

    <!-- Discs for Row 0..6 across Columns 0..8 -->
    <!-- Row 0 (cy = 675) -->
    <circle cx="185" cy="675" r="32" fill="url(#emptySlot)" stroke="#10b981" stroke-width="3"/>
    <circle cx="275" cy="675" r="32" fill="url(#emptySlot)" stroke="#3b82f6" stroke-width="3"/>
    <circle cx="365" cy="675" r="32" fill="url(#emptySlot)" stroke="#ec4899" stroke-width="3"/>
    <circle cx="455" cy="675" r="32" fill="url(#emptySlot)" stroke="#a855f7" stroke-width="3"/>
    <!-- OPENING CELL (4, 0) -->
    <circle cx="545" cy="675" r="33" fill="url(#openingDisc)" stroke="#ffffff" stroke-width="4" filter="url(#glow)"/>
    <text x="545" y="682" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">W (1)</text>

    <circle cx="635" cy="675" r="32" fill="url(#emptySlot)" stroke="#a855f7" stroke-width="3"/>
    <circle cx="725" cy="675" r="32" fill="url(#emptySlot)" stroke="#ec4899" stroke-width="3"/>
    <circle cx="815" cy="675" r="32" fill="url(#emptySlot)" stroke="#3b82f6" stroke-width="3"/>
    <circle cx="905" cy="675" r="32" fill="url(#emptySlot)" stroke="#10b981" stroke-width="3"/>

    <!-- Row 1 (cy = 595) -->
    <circle cx="185" cy="595" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="275" cy="595" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="365" cy="595" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="455" cy="595" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="545" cy="595" r="33" fill="url(#blackDisc)" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
    <text x="545" y="602" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">B (2)</text>
    <circle cx="635" cy="595" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="725" cy="595" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="815" cy="595" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="905" cy="595" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>

    <!-- Row 2 (cy = 510) -->
    <circle cx="185" cy="510" r="32" fill="url(#emptySlot)" stroke="#475569" stroke-width="2"/>
    <circle cx="275" cy="510" r="32" fill="url(#emptySlot)" stroke="#475569" stroke-width="2"/>
    <circle cx="365" cy="510" r="32" fill="url(#emptySlot)" stroke="#475569" stroke-width="2"/>
    <circle cx="455" cy="510" r="32" fill="url(#emptySlot)" stroke="#475569" stroke-width="2"/>
    <circle cx="545" cy="510" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="3"/>
    <circle cx="635" cy="510" r="32" fill="url(#emptySlot)" stroke="#475569" stroke-width="2"/>
    <circle cx="725" cy="510" r="32" fill="url(#emptySlot)" stroke="#475569" stroke-width="2"/>
    <circle cx="815" cy="510" r="32" fill="url(#emptySlot)" stroke="#475569" stroke-width="2"/>
    <circle cx="905" cy="510" r="32" fill="url(#emptySlot)" stroke="#475569" stroke-width="2"/>

    <!-- Row 3 (cy = 425) -->
    <circle cx="185" cy="425" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="275" cy="425" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="365" cy="425" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="455" cy="425" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="545" cy="425" r="32" fill="url(#emptySlot)" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="635" cy="425" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="725" cy="425" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="815" cy="425" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="905" cy="425" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>

    <!-- Row 4 (cy = 340) -->
    <circle cx="185" cy="340" r="32" fill="url(#emptySlot)" stroke="#475569" stroke-width="2"/>
    <circle cx="275" cy="340" r="32" fill="url(#emptySlot)" stroke="#475569" stroke-width="2"/>
    <circle cx="365" cy="340" r="32" fill="url(#emptySlot)" stroke="#475569" stroke-width="2"/>
    <circle cx="455" cy="340" r="32" fill="url(#emptySlot)" stroke="#475569" stroke-width="2"/>
    <circle cx="545" cy="340" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="3"/>
    <circle cx="635" cy="340" r="32" fill="url(#emptySlot)" stroke="#475569" stroke-width="2"/>
    <circle cx="725" cy="340" r="32" fill="url(#emptySlot)" stroke="#475569" stroke-width="2"/>
    <circle cx="815" cy="340" r="32" fill="url(#emptySlot)" stroke="#475569" stroke-width="2"/>
    <circle cx="905" cy="340" r="32" fill="url(#emptySlot)" stroke="#475569" stroke-width="2"/>

    <!-- Row 5 (cy = 255) -->
    <circle cx="185" cy="255" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="275" cy="255" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="365" cy="255" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="455" cy="255" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="545" cy="255" r="32" fill="url(#emptySlot)" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="635" cy="255" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="725" cy="255" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="815" cy="255" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="905" cy="255" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>

    <!-- Row 6 (Roof, cy = 170) -->
    <circle cx="185" cy="170" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="275" cy="170" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="365" cy="170" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="455" cy="170" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="545" cy="170" r="32" fill="url(#emptySlot)" stroke="#f59e0b" stroke-width="2"/>
    <text x="545" y="176" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Dead (4,6)</text>
    <circle cx="635" cy="170" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="725" cy="170" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="815" cy="170" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
    <circle cx="905" cy="170" r="32" fill="url(#claimCell)" stroke="#059669" stroke-width="2"/>
  </g>

  <!-- Legend & Verification Card -->
  <g transform="translate(140, 755)" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">
    <!-- Card Background -->
    <rect x="-10" y="-12" width="840" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

    <!-- Legend Items -->
    <!-- Item 1: Opening (4, 0) -->
    <circle cx="15" cy="12" r="10" fill="url(#openingDisc)"/>
    <text x="35" y="16" fill="#f87171" font-weight="bold">White Opening (4, 0)</text>

    <!-- Item 2: Reply (4, 1) -->
    <circle cx="185" cy="12" r="10" fill="url(#blackDisc)"/>
    <text x="205" y="16" fill="#38bdf8" font-weight="bold">Black Reply (4, 1)</text>

    <!-- Item 3: Transversal Claims -->
    <circle cx="345" cy="12" r="10" fill="url(#claimCell)"/>
    <text x="365" y="16" fill="#34d399" font-weight="bold">Black Transversal Set (31 Cells)</text>

    <!-- Item 4: Base Pairs -->
    <line x1="565" y1="12" x2="595" y2="12" stroke="#a855f7" stroke-width="3"/>
    <text x="605" y="16" fill="#c084fc" font-weight="bold">Base Horizontal Pairs</text>

    <!-- Subtitle stats -->
    <text x="15" y="38" fill="#94a3b8">
      Rocq 9.1: 25 Theorems (0 Axioms) | Lean 4.35: 15 Theorems (0 Sorry) | C11 Solver: 4/4 Audit Passes
    </text>
    <text x="635" y="38" fill="#38bdf8" font-weight="bold">
      92 / 92 Lines (100.0%) Blocked
    </text>
  </g>
</svg>
