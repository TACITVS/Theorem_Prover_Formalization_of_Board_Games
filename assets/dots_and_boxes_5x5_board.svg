    <line x1="180" y1="160" x2="330" y2="160" stroke="#f59e0b" stroke-width="5" filter="url(#amberGlow)" />
    <line x1="330" y1="160" x2="480" y2="160" stroke="#f59e0b" stroke-width="5" filter="url(#amberGlow)" />
    <line x1="480" y1="160" x2="630" y2="160" stroke="#f59e0b" stroke-width="5" filter="url(#amberGlow)" />
    <line x1="630" y1="160" x2="780" y2="160" stroke="#f59e0b" stroke-width="5" filter="url(#amberGlow)" />

    <!-- Row 1: y=310 (Interior Cyan #06b6d4) -->
    <line x1="180" y1="310" x2="330" y2="310" stroke="#06b6d4" stroke-width="4" filter="url(#cyanGlow)" />
    <line x1="330" y1="310" x2="480" y2="310" stroke="#06b6d4" stroke-width="4" filter="url(#cyanGlow)" />
    <line x1="480" y1="310" x2="630" y2="310" stroke="#06b6d4" stroke-width="4" filter="url(#cyanGlow)" />
    <line x1="630" y1="310" x2="780" y2="310" stroke="#06b6d4" stroke-width="4" filter="url(#cyanGlow)" />

    <!-- Row 2: y=460 (Interior Cyan #06b6d4) -->
    <line x1="180" y1="460" x2="330" y2="460" stroke="#06b6d4" stroke-width="4" filter="url(#cyanGlow)" />
    <line x1="330" y1="460" x2="480" y2="460" stroke="#06b6d4" stroke-width="4" filter="url(#cyanGlow)" />
    <line x1="480" y1="460" x2="630" y2="460" stroke="#06b6d4" stroke-width="4" filter="url(#cyanGlow)" />
    <line x1="630" y1="460" x2="780" y2="460" stroke="#06b6d4" stroke-width="4" filter="url(#cyanGlow)" />

    <!-- Row 3: y=610 (Interior Cyan #06b6d4) -->
    <line x1="180" y1="610" x2="330" y2="610" stroke="#06b6d4" stroke-width="4" filter="url(#cyanGlow)" />
    <line x1="330" y1="610" x2="480" y2="610" stroke="#06b6d4" stroke-width="4" filter="url(#cyanGlow)" />
    <line x1="480" y1="610" x2="630" y2="610" stroke="#06b6d4" stroke-width="4" filter="url(#cyanGlow)" />
    <line x1="630" y1="610" x2="780" y2="610" stroke="#06b6d4" stroke-width="4" filter="url(#cyanGlow)" />

    <!-- Row 4: y=760 (Bottom Boundary Gold #f59e0b) -->
    <line x1="180" y1="760" x2="330" y2="760" stroke="#f59e0b" stroke-width="5" filter="url(#amberGlow)" />
    <line x1="330" y1="760" x2="480" y2="760" stroke="#f59e0b" stroke-width="5" filter="url(#amberGlow)" />
    <line x1="480" y1="760" x2="630" y2="760" stroke="#f59e0b" stroke-width="5" filter="url(#amberGlow)" />
    <line x1="630" y1="760" x2="780" y2="760" stroke="#f59e0b" stroke-width="5" filter="url(#amberGlow)" />
  </g>

  <!-- Vertical Edges (20): 20..39 -->
