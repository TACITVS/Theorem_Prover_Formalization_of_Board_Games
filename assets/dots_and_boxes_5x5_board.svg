    <!-- Row 0 -->
    <circle cx="180" cy="160" r="7" /><circle cx="330" cy="160" r="7" /><circle cx="480" cy="160" r="7" /><circle cx="630" cy="160" r="7" /><circle cx="780" cy="160" r="7" />
