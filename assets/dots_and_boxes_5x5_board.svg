    <!-- Row 0: y from 160 to 310 -->
    <line x1="180" y1="160" x2="180" y2="310" stroke="#f59e0b" stroke-width="5" filter="url(#amberGlow)" />
    <line x1="330" y1="160" x2="330" y2="310" stroke="#06b6d4" stroke-width="4" filter="url(#cyanGlow)" />
    <line x1="480" y1="160" x2="480" y2="310" stroke="#06b6d4" stroke-width="4" filter="url(#cyanGlow)" />
    <line x1="630" y1="160" x2="630" y2="310" stroke="#06b6d4" stroke-width="4" filter="url(#cyanGlow)" />
    <line x1="780" y1="160" x2="780" y2="310" stroke="#f59e0b" stroke-width="5" filter="url(#amberGlow)" />

    <!-- Row 1: y from 310 to 460 -->
