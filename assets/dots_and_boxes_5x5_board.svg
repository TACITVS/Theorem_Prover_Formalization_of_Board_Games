    <line x1="330" y1="310" x2="330" y2="460" stroke="#06b6d4" stroke-width="4" filter="url(#cyanGlow)" />
    <line x1="480" y1="310" x2="480" y2="460" stroke="#06b6d4" stroke-width="4" filter="url(#cyanGlow)" />
    <line x1="630" y1="310" x2="630" y2="460" stroke="#06b6d4" stroke-width="4" filter="url(#cyanGlow)" />
    <line x1="780" y1="310" x2="780" y2="460" stroke="#f59e0b" stroke-width="5" filter="url(#amberGlow)" />

    <!-- Row 2: y from 460 to 610 -->
