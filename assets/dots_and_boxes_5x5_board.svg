<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Edge Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="960" height="960" fill="url(#bgGrad)" />

  <!-- Header Section -->
  <g transform="translate(480, 55)" text-anchor="middle">
    <text font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#f8fafc" letter-spacing="1.5">
      DOTS AND BOXES: 5×5 DOTS / 4×4 BOXES GRID
    </text>
    <text y="28" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">
      V = 25 Dots | E = 40 Edges (16 Boundary + 24 Interior) | B = 16 Boxes | D₄ Automorphism Group
    </text>
  </g>

  <!-- Grid Origin: Top-Left dot at (180, 150), spacing 150px -->
  <!-- Coordinates: col x = 180 + c*150 (c=0..4: 180, 330, 480, 630, 780) -->
  <!--              row y = 160 + r*150 (r=0..4: 160, 310, 460, 610, 760) -->

  <!-- Box Cells (4x4) -->
  <!-- b = 4*r + c -->
  <g font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle" dominant-baseline="central">
    <!-- Row 0: y=235 -->
    <rect x="180" y="160" width="150" height="150" fill="#1e293b" fill-opacity="0.25" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="255" y="225" font-size="16" font-weight="700" fill="#38bdf8">B₀</text>
    <text x="255" y="247" font-size="11" fill="#64748b">(0,0)</text>

    <rect x="330" y="160" width="150" height="150" fill="#1e293b" fill-opacity="0.25" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="405" y="225" font-size="16" font-weight="700" fill="#38bdf8">B₁</text>
    <text x="405" y="247" font-size="11" fill="#64748b">(0,1)</text>

    <rect x="480" y="160" width="150" height="150" fill="#1e293b" fill-opacity="0.25" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="555" y="225" font-size="16" font-weight="700" fill="#38bdf8">B₂</text>
    <text x="555" y="247" font-size="11" fill="#64748b">(0,2)</text>

    <rect x="630" y="160" width="150" height="150" fill="#1e293b" fill-opacity="0.25" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="705" y="225" font-size="16" font-weight="700" fill="#38bdf8">B₃</text>
    <text x="705" y="247" font-size="11" fill="#64748b">(0,3)</text>

    <!-- Row 1: y=385 -->
    <rect x="180" y="310" width="150" height="150" fill="#1e293b" fill-opacity="0.25" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="255" y="375" font-size="16" font-weight="700" fill="#38bdf8">B₄</text>
    <text x="255" y="397" font-size="11" fill="#64748b">(1,0)</text>

    <rect x="330" y="310" width="150" height="150" fill="#0369a1" fill-opacity="0.15" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="405" y="375" font-size="16" font-weight="700" fill="#38bdf8">B₅</text>
    <text x="405" y="397" font-size="11" fill="#64748b">(1,1)</text>

    <rect x="480" y="310" width="150" height="150" fill="#0369a1" fill-opacity="0.15" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="555" y="375" font-size="16" font-weight="700" fill="#38bdf8">B₆</text>
    <text x="555" y="397" font-size="11" fill="#64748b">(1,2)</text>

    <rect x="630" y="310" width="150" height="150" fill="#1e293b" fill-opacity="0.25" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="705" y="375" font-size="16" font-weight="700" fill="#38bdf8">B₇</text>
    <text x="705" y="397" font-size="11" fill="#64748b">(1,3)</text>

    <!-- Row 2: y=535 -->
    <rect x="180" y="460" width="150" height="150" fill="#1e293b" fill-opacity="0.25" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="255" y="525" font-size="16" font-weight="700" fill="#38bdf8">B₈</text>
    <text x="255" y="547" font-size="11" fill="#64748b">(2,0)</text>

    <rect x="330" y="460" width="150" height="150" fill="#0369a1" fill-opacity="0.15" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="405" y="525" font-size="16" font-weight="700" fill="#38bdf8">B₉</text>
    <text x="405" y="547" font-size="11" fill="#64748b">(2,1)</text>

    <rect x="480" y="460" width="150" height="150" fill="#0369a1" fill-opacity="0.15" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="555" y="525" font-size="16" font-weight="700" fill="#38bdf8">B₁₀</text>
    <text x="555" y="547" font-size="11" fill="#64748b">(2,2)</text>

    <rect x="630" y="460" width="150" height="150" fill="#1e293b" fill-opacity="0.25" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="705" y="525" font-size="16" font-weight="700" fill="#38bdf8">B₁₁</text>
    <text x="705" y="547" font-size="11" fill="#64748b">(2,3)</text>

    <!-- Row 3: y=685 -->
    <rect x="180" y="610" width="150" height="150" fill="#1e293b" fill-opacity="0.25" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="255" y="675" font-size="16" font-weight="700" fill="#38bdf8">B₁₂</text>
    <text x="255" y="697" font-size="11" fill="#64748b">(3,0)</text>

    <rect x="330" y="610" width="150" height="150" fill="#1e293b" fill-opacity="0.25" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="405" y="675" font-size="16" font-weight="700" fill="#38bdf8">B₁₃</text>
    <text x="405" y="697" font-size="11" fill="#64748b">(3,1)</text>

    <rect x="480" y="610" width="150" height="150" fill="#1e293b" fill-opacity="0.25" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="555" y="675" font-size="16" font-weight="700" fill="#38bdf8">B₁₄</text>
    <text x="555" y="697" font-size="11" fill="#64748b">(3,2)</text>

    <rect x="630" y="610" width="150" height="150" fill="#1e293b" fill-opacity="0.25" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="705" y="675" font-size="16" font-weight="700" fill="#38bdf8">B₁₅</text>
    <text x="705" y="697" font-size="11" fill="#64748b">(3,3)</text>
  </g>

  <!-- Horizontal Edges (20): 0..19 -->
