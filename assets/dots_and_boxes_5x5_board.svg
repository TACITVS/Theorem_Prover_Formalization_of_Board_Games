    <circle cx="555" cy="450" r="9" fill="#020617" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="555" y="450" fill="#38bdf8">10</text>
    <circle cx="705" cy="450" r="9" fill="#020617" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="705" y="450" fill="#38bdf8">11</text>

    <!-- H12..H15 -->
    <circle cx="255" cy="600" r="9" fill="#020617" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="255" y="600" fill="#38bdf8">12</text>
    <circle cx="405" cy="600" r="9" fill="#020617" stroke="#06b6d4" stroke-width="1.5"/>
